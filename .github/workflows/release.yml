name: Release

# Publishing a GitHub release tagged vX.Y.Z (matching `version` in pyproject.toml) builds
# sluicebox and uploads it to PyPI with trusted publishing: PyPI trusts this workflow through
# OpenID Connect, so no API token is stored anywhere.
#
# One-time setup on PyPI (Publishing -> add a pending publisher, or the project's Publishing
# settings once it exists): project "sluicebox", owner "davidson-engineering", repository
# "sluicebox", workflow "release.yml", environment "pypi".
#
# This workflow can upload to PyPI, so its actions are pinned to commit SHAs.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest tests/unit
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sluicebox
    permissions:
      id-token: write # trusted publishing (and PEP 740 attestations)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
