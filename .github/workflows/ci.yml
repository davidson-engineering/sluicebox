name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # polars publishes only abi3 wheels, which free-threaded Python cannot load (it would
          # be compiled from source for an hour): test 3.14t without it.
          - python: "3.14t"
            skip: --no-install-package polars --no-install-package polars-runtime-32
          # Per-thread write state (lanes, serializer views), as on 3.14t, with the GIL.
          - python: "3.14 per-thread"
            interpreter: "3.14"
            per_thread: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.interpreter || matrix.python }}
      - run: uv sync --locked ${{ matrix.skip }}
      - run: uv run --no-sync pytest tests/unit
        env:
          SLUICEBOX_TEST_PER_THREAD: ${{ matrix.per_thread }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: docker/tls/generate.sh
      - run: docker compose --profile network up -d --wait
      - run: uv run pytest -ra
      - if: failure()
        run: docker compose --profile network logs --tail 200
