# Reverse proxy in front of the test servers:
#  * :8086 / :8181 - plain HTTP with a deliberately small request body limit, as commonly found in
#    front of InfluxDB; oversized writes get an HTML "413 Request Entity Too Large".
#  * :8443 - TLS that requires a client certificate (mutual TLS), for HTTP writes and for
#    InfluxDB 3's Arrow Flight (gRPC) queries.
events {}
http {
  upstream influxdb2 { server influxdb2:8086; keepalive 16; }
  upstream influxdb3 { server influxdb3:8181; keepalive 16; }
  upstream influxdb3_grpc { server influxdb3:8181; keepalive 16; }

  server {
    listen 8086;
    client_max_body_size 256k;
    location / {
      proxy_pass http://influxdb2;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
  server {
    listen 8181;
    client_max_body_size 256k;
    location / {
      proxy_pass http://influxdb3;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
  server {
    listen 8443 ssl;
    http2 on;
    client_max_body_size 64m;
    ssl_certificate /etc/tls/server.crt;
    ssl_certificate_key /etc/tls/server.key;
    ssl_client_certificate /etc/tls/ca.crt;
    ssl_verify_client on;
    location /arrow.flight.protocol.FlightService/ {
      grpc_pass grpc://influxdb3_grpc;
    }
    location / {
      proxy_pass http://influxdb3;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
